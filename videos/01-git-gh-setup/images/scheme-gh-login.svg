<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#f6f8fa"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">gh auth login — 4 шага</text>

  <!-- Step cards -->
  <g>
    <rect x="24" y="64" width="204" height="250" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="52" cy="92" r="16" fill="#0969da"/><text x="52" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
    <text x="76" y="98" font-size="15" font-weight="700" fill="#1f2328">Запусти</text>
    <rect x="40" y="124" width="172" height="40" rx="8" fill="#24292f"/>
    <text x="126" y="149" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#7ee787">$ gh auth login</text>
    <text x="40" y="196" font-size="13" fill="#1f2328">В любом терминале:</text>
    <text x="40" y="216" font-size="13" fill="#57606a">Terminal / PowerShell /</text>
    <text x="40" y="234" font-size="13" fill="#57606a">Git Bash / bash</text>
  </g>
  <g>
    <rect x="254" y="64" width="204" height="250" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="282" cy="92" r="16" fill="#0969da"/><text x="282" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
    <text x="306" y="98" font-size="15" font-weight="700" fill="#1f2328">Ответь на вопросы</text>
    <text x="270" y="132" font-size="13" fill="#1f2328">Account:</text>
    <text x="270" y="150" font-size="13" font-weight="700" fill="#1a7f37">GitHub.com</text>
    <text x="270" y="178" font-size="13" fill="#1f2328">Protocol:</text>
    <text x="270" y="196" font-size="13" font-weight="700" fill="#1a7f37">HTTPS</text>
    <text x="270" y="224" font-size="13" fill="#1f2328">Authenticate Git?</text>
    <text x="270" y="242" font-size="13" font-weight="700" fill="#1a7f37">Yes</text>
    <text x="270" y="278" font-size="12" fill="#57606a">стрелки ↑↓ и Enter</text>
  </g>
  <g>
    <rect x="484" y="64" width="204" height="250" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="512" cy="92" r="16" fill="#0969da"/><text x="512" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
    <text x="536" y="98" font-size="15" font-weight="700" fill="#1f2328">Войди через браузер</text>
    <text x="500" y="132" font-size="13" fill="#1f2328">Login with a web browser</text>
    <rect x="500" y="150" width="172" height="48" rx="8" fill="#24292f"/>
    <text x="586" y="170" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#c9d1d9">one-time code:</text>
    <text x="586" y="188" text-anchor="middle" font-size="16" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#7ee787">ABCD-1234</text>
    <text x="500" y="226" font-size="13" fill="#1f2328">Скопируй код</text>
    <text x="500" y="244" font-size="13" fill="#1f2328">и нажми Enter</text>
  </g>
  <g>
    <rect x="714" y="64" width="222" height="250" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="742" cy="92" r="16" fill="#0969da"/><text x="742" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
    <text x="766" y="98" font-size="15" font-weight="700" fill="#1f2328">Подтверди на сайте</text>
    <rect x="730" y="116" width="190" height="26" rx="6" fill="#eaeef2"/>
    <text x="825" y="134" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#1f2328">github.com/login/device</text>
    <text x="730" y="170" font-size="13" fill="#1f2328">• вставь код</text>
    <text x="730" y="190" font-size="13" fill="#1f2328">• Continue</text>
    <text x="730" y="210" font-size="13" fill="#1f2328">• Authorize github</text>
    <rect x="730" y="236" width="190" height="52" rx="8" fill="#24292f"/>
    <text x="825" y="258" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7ee787">✓ Logged in as</text>
    <text x="825" y="276" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7ee787">твой-логин</text>
  </g>

  <!-- Arrows -->
  <line x1="230" y1="190" x2="252" y2="190" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
  <line x1="460" y1="190" x2="482" y2="190" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
  <line x1="690" y1="190" x2="712" y2="190" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>

  <rect x="24" y="338" width="912" height="40" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="480" y="363" text-anchor="middle" font-size="14" fill="#1f2328">Проверка: <tspan font-family="Menlo, Consolas, monospace" font-weight="700">gh auth status</tspan> → «Logged in to github.com account …»</text>
</svg>
